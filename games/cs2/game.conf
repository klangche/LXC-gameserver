# Game settings read by install.sh (defaults for the Proxmox helper script)
GAME="cs2"
TITLE="Counter-Strike 2"
# KEY|Label for every mandatory password of this game (written to passwords.env)
PASSWORDS=("CS2_PW|Server (join) password" "CS2_RCONPW|RCON (remote admin) password" "SRCDS_TOKEN|Steam Game Server Login Token (create at https://steamcommunity.com/dev/managegameservers, appid 730)")
FILES=(docker-compose.yml passwords.env install-server-commands.sh)
GAME_CPU=4
GAME_RAM=4096
GAME_DISK=60
